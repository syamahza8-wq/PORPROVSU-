<!doctype html>
<html lang="id">

    <link rel="icon" type="image/png" href="./assets/logo-B0PT1F8_.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PORPROVSU - Pekan Olahraga Provinsi Sumatera Utara Resmi</title>
    <meta name="description" content="Portal Resmi Pekan Olahraga Provinsi Sumatera Utara (PORPROVSU) - Klasemen Medali Kabupaten/Kota, Data Atlet & Pelatih, Lokasi Cabor, Jadwal Pertandingan berbasis Firebase Firestore." />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cinzel:wght@600;700;900&display=swap" rel="stylesheet">
    
    <!-- Protocol Check: If opened via file:// directly, show bright guidance to open via web server -->
    <script>
      (function() {
        if (window.location.protocol === 'file:') {
          setTimeout(function() {
            var root = document.getElementById('root');
            if (root && (!root.children || root.children.length === 0)) {
              root.innerHTML = '<div style="min-height: 100vh; background: #F8FAFC; color: #0F172A; display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif; padding: 20px;">' +
                '<div style="max-width: 520px; width: 100%; background: #FFFFFF; border: 2px solid #D97706; border-radius: 24px; padding: 36px; text-align: center; box-shadow: 0 20px 40px -12px rgba(15,23,42,0.12);">' +
                '<div style="width: 64px; height: 64px; background: #FEF3C7; border: 2px solid #D97706; border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 30px;">🌐</div>' +
                '<h2 style="font-size: 22px; font-weight: 800; color: #0B192C; margin-bottom: 8px;">Buka Melalui Server Web Lokal / Hosting</h2>' +
                '<p style="font-size: 13px; color: #475569; line-height: 1.6; margin-bottom: 24px;">' +
                'Anda membuka file lewat protokol lokal (<strong style="color: #DC2626;">file:///...</strong>). Browser modern membatasi modul ES & koneksi Firebase Firestore jika dibuka tanpa web server.' +
                '</p>' +
                '<div style="background: #F1F5F9; border: 1px solid #CBD5E1; border-radius: 16px; padding: 16px; margin-bottom: 24px;">' +
                '<p style="font-size: 11px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.05em; color: #B45309; margin-bottom: 6px;">Silakan akses lewat alamat berikut:</p>' +
                '<a href="http://localhost/porprovsu" style="font-size: 18px; font-weight: 800; color: #1E3E62; text-decoration: underline; word-break: break-all;">http://localhost/porprovsu</a>' +
                '</div>' +
                '<a href="http://localhost/porprovsu" style="display: inline-block; width: 100%; padding: 14px 20px; background: #D97706; color: white; font-weight: 700; border-radius: 14px; text-decoration: none; font-size: 14px; box-sizing: border-box; text-transform: uppercase; letter-spacing: 0.05em;">' +
                'Buka Portal PORPROVSU Sekarang' +

                '</div>' +
                '</div>';
            }
          }, 300);
        }
      })();
    </script>

    <script type="module" crossorigin src="./assets/main-Ck6MiZSY.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/main-vETgdV-Z.css">
