<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./assets/logo-B0PT1F8_.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PORPROVSU - Pekan Olahraga Provinsi Sumatera Utara Resmi</title>
    <meta name="description" content="Portal Resmi Pekan Olahraga Provinsi Sumatera Utara (PORPROVSU) - Jadwal, Hasil Pertandingan, Klasemen Medali, Profil Kontingen, dan Berita Terkini." />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cinzel:wght@600;700;900&display=swap" rel="stylesheet">
    
    <!-- Protocol Check: If opened via file:// directly, auto-prompt to open via http://localhost/porprovsu -->
    <script>
      (function() {
        if (window.location.protocol === 'file:') {
          // Attempt automatic redirection to local web server
          setTimeout(function() {
            var root = document.getElementById('root');
            if (root && (!root.children || root.children.length === 0)) {
              root.innerHTML = '<div style="min-height: 100vh; background: #0B192C; color: white; display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif; padding: 20px;">' +
                '<div style="max-width: 520px; width: 100%; background: #1E293B; border: 2px solid #D97706; border-radius: 24px; padding: 36px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6);">' +
                '<div style="width: 64px; height: 64px; background: rgba(217, 119, 6, 0.2); border: 2px solid #D97706; border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 30px;">⚡</div>' +
                '<h2 style="font-size: 22px; font-weight: 800; color: #FFFFFF; margin-bottom: 8px;">Buka Lewat Server Laragon</h2>' +
                '<p style="font-size: 13px; color: #94A3B8; line-height: 1.6; margin-bottom: 24px;">' +
                'Anda saat ini membuka web melalui klik file langsung (<strong style="color: #F87171;">file:///...</strong>). Browser Chrome memblokir script web modern pada protokol file:// demi keamanan.' +
                '</p>' +
                '<div style="background: #0F172A; border: 1px solid #334155; border-radius: 16px; padding: 16px; margin-bottom: 24px;">' +
                '<p style="font-size: 11px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.05em; color: #F59E0B; margin-bottom: 6px;">Buka alamat berikut di browser:</p>' +
                '<a href="http://localhost/porprovsu" style="font-size: 18px; font-weight: 800; color: #38BDF8; text-decoration: none; word-break: break-all;">http://localhost/porprovsu</a>' +
                '</div>' +
                '<a href="http://localhost/porprovsu" style="display: inline-block; width: 100%; padding: 14px 20px; background: #D97706; color: white; font-weight: 700; border-radius: 14px; text-decoration: none; font-size: 14px; box-sizing: border-box; text-transform: uppercase; letter-spacing: 0.05em; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);">' +
                'Klik Di Sini Untuk Buka di Localhost' +
                '</a>' +
                '<p style="font-size: 11px; color: #64748B; margin-top: 16px;">Atau jalankan file <strong>BUKA_WEBSITE.bat</strong> di folder porprovsu</p>' +
                '</div>' +
                '</div>';
            }
          }, 300);
        }
      })();
    </script>

    <script type="module" crossorigin src="./assets/main-Do1VbIeF.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/main-C1ky9JKy.css">
  </head>
  <body class="bg-brand-surface text-brand-dark antialiased selection:bg-brand-gold selection:text-white">
    <div id="root"></div>
  </body>
</html>
